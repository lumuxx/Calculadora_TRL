    - btnRecalcServ:
        Control: Classic/Button
        Properties:
          Text: ="recalc"
          X: =0
          Y: =0
          Width: =10
          Height: =10
          OnSelect: |-
            =With({h: Filter(Servicos, Vinculo.Vinculo = varVinc.Vinculo)},
                With({n: CountRows(h), q: Average(h, NotaQualidade), p: Average(h, NotaPrazo), c: Average(h, NotaCusto)},
                    Set(varVinc,
                        Patch(Vinculos, LookUp(Vinculos, Vinculo = varVinc.Vinculo), {
                            MediaQualidade: If(n > 0, Round(q, 2)),
                            MediaPrazo: If(n > 0, Round(p, 2)),
                            MediaCusto: If(n > 0, Round(c, 2)),
                            IndiceGlobal: If(n > 0, Round((q + p + c) / 3, 2)),
                            QtdServicos: n,
                            UltimoServico: Max(h, DataOrcamento),
                            StatusCalculado: StatusPor(n, If(n > 0, (q + p + c) / 3, 0))
                        })
                    )
                )
            );
            Select(btnCarregarFicha)
          Fill: =Cor.Superficie
          Color: =Cor.Tinta
          BorderColor: =Cor.Linha
          BorderThickness: =1
          HoverFill: =Cor.Afundado
          HoverColor: =Cor.Tinta
          HoverBorderColor: =Cor.Linha
          PressedFill: =Cor.Afundado
          PressedColor: =Cor.Tinta
          PressedBorderColor: =Cor.Linha
          RadiusTopLeft: =6
          RadiusTopRight: =6
          RadiusBottomLeft: =6
          RadiusBottomRight: =6
          Size: =11
          FontWeight: =FontWeight.Semibold
          Font: =Fonte
          Visible: =false
    - btnRecalcCap:
        Control: Classic/Button
        Properties:
          Text: ="recalc cap"
          X: =0
          Y: =0
          Width: =10
          Height: =10
          OnSelect: |-
            =With({caps: Filter(Capacidades, Segmento.Segmento = varVinc.Segmento.Segmento && Ativa)},
                With({pesos: Sum(caps, Peso)},
                    Set(varVinc,
                        Patch(Vinculos, LookUp(Vinculos, Vinculo = varVinc.Vinculo), {
                            NotaCapacidade: If(pesos > 0 && CountRows(colAval) > 0,
                                Round(Sum(caps As k,
                                    Switch(LookUp(colAval, Capacidade.Capacidade = k.Capacidade).Atendimento,
                                        "atende", k.Peso, "parcial", k.Peso / 2, 0)) / pesos * 5, 2))
                        })
                    )
                )
            )
          Fill: =Cor.Superficie
          Color: =Cor.Tinta
          BorderColor: =Cor.Linha
          BorderThickness: =1
          HoverFill: =Cor.Afundado
          HoverColor: =Cor.Tinta
          HoverBorderColor: =Cor.Linha
          PressedFill: =Cor.Afundado
          PressedColor: =Cor.Tinta
          PressedBorderColor: =Cor.Linha
