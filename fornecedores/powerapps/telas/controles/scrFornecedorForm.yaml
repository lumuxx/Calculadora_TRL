    - btnFormCancelar:
        Control: Classic/Button
        Properties:
          Text: ="Cancelar"
          X: =Parent.Width - 24 - 140 - 12 - 120
          Y: =476
          Width: =120
          Height: =38
          OnSelect: =Back()
          Fill: =Cor.Superficie
          Color: =Cor.Tinta
          BorderColor: =Cor.Linha
          BorderThickness: =1
          HoverFill: =Cor.Afundado
          HoverColor: =Cor.Tinta
          HoverBorderColor: =Cor.Linha
          PressedFill: =Cor.Afundado
          PressedColor: =Cor.Tinta
          PressedBorderColor: =Cor.Linha
          RadiusTopLeft: =6
          RadiusTopRight: =6
          RadiusBottomLeft: =6
          RadiusBottomRight: =6
          Size: =11
          FontWeight: =FontWeight.Semibold
          Font: =Fonte
    - btnFormSalvar:
        Control: Classic/Button
        Properties:
          Text: =If(IsBlank(varForn), "Cadastrar", "Salvar")
          X: =Parent.Width - 24 - 140
          Y: =476
          Width: =140
          Height: =38
          OnSelect: |-
            =If(IsBlank(Trim(txtFormEmpresa.Text)),
                Notify("Informe o nome da empresa.", NotificationType.Error),
                Set(varForn,
                    Patch(Fornecedores, If(IsBlank(varForn), Defaults(Fornecedores), varForn), {
                        Empresa: Trim(txtFormEmpresa.Text),
                        CNPJ: txtFormCnpj.Text,
                        Responsavel: txtFormResp.Text,
                        Telefone: txtFormTel.Text,
                        Email: txtFormEmail.Text,
                        Endereco: txtFormEnd.Text,
                        Observacoes: txtFormObs.Text,
                        Ativo: chkFormAtivo.Value
                    })
                );
                ForAll(cbFormSegs.SelectedItems As s,
                    If(IsBlank(LookUp(Vinculos, Fornecedor.Fornecedor = varForn.Fornecedor && Segmento.Segmento = s.Segmento)),
                        Patch(Vinculos, Defaults(Vinculos), {
                            Nome: varForn.Empresa & " — " & s.Nome,
                            Fornecedor: varForn,
                            Segmento: s,
                            StatusCalculado: "Em avaliação",
                            Especializado: false,
                            QtdServicos: 0
                        })
                    )
                );
                Set(varVinc, First(Filter(Vinculos, Fornecedor.Fornecedor = varForn.Fornecedor)));
                Notify("Fornecedor salvo.", NotificationType.Success);
                Navigate(scrFicha, ScreenTransition.None)
            )
          Fill: =Cor.Destaque
          Color: =Cor.Superficie
          BorderColor: =Cor.Destaque
          BorderThickness: =1
          HoverFill: =ColorFade(Cor.Destaque, -0.12)
          HoverColor: =Cor.Superficie
          HoverBorderColor: =Cor.Destaque
          PressedFill: =ColorFade(Cor.Destaque, -0.12)
          PressedColor: =Cor.Superficie
          PressedBorderColor: =Cor.Destaque
          RadiusTopLeft: =6
          RadiusTopRight: =6
          RadiusBottomLeft: =6
          RadiusBottomRight: =6
          Size: =11
          FontWeight: =FontWeight.Semibold
          Font: =Fonte
