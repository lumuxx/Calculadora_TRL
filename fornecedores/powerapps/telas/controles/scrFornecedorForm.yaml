    - cbFormSegs:
        Control: Classic/ComboBox
        Properties:
          Items: =Sort(Segmentos, Ordem)
          DisplayFields: =["Nome"]
          SearchFields: =["Nome"]
          SelectMultiple: =true
          InputTextPlaceholder: ="Escolha os segmentos"
          IsSearchable: =true
          X: =24
          Y: =288
          Width: =(Parent.Width - 48 - 16) / 2
          Height: =36
          Font: =Fonte
          Size: =11
          BorderColor: =Cor.Linha
          BorderThickness: =1
          ChevronBackground: =Cor.Superficie
          ChevronFill: =Cor.Suave
          SelectionFill: =Cor.Destaque
          SelectionColor: =Cor.Superficie
          DefaultSelectedItems: =Filter(Segmentos As s, !IsBlank(LookUp(Vinculos, Fornecedor.Fornecedor = varForn.Fornecedor && Segmento.Segmento = s.Segmento)))
    - chkFormAtivo:
        Control: Classic/CheckBox
        Properties:
          Text: ="Fornecedor ativo"
          Default: =Coalesce(varForn.Ativo, true)
          X: =24 + (Parent.Width - 48 - 16) / 2 + 16
          Y: =288
