    - galFornecedores:
        Control: Gallery
        Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
        Properties:
          Items: |-
            =With({busca: Lower(Trim(txtBuscaForn.Text))},
                SortByColumns(
                    Filter(Fornecedores As fo,
                        IsBlank(busca) || busca in Lower(fo.Empresa) || busca in Lower(fo.Responsavel) || busca in Lower(fo.CNPJ),
                        IsBlank(varSegFiltro)
                            || !IsBlank(LookUp(Vinculos, Fornecedor.Fornecedor = fo.Fornecedor && Segmento.Segmento = varSegFiltro.Segmento))
                    ),
                    "Empresa"
                )
            )
          X: =16
          Y: =84
          Width: =Parent.Width - 32
          Height: =Parent.Height - 84 - 12
          TemplateSize: =52
          TemplatePadding: =0
          WrapCount: =1
          ShowScrollbar: =true
          BorderThickness: =0
          OnSelect: =Set(varForn, ThisItem); Set(varVinc, First(Filter(Vinculos, Fornecedor.Fornecedor = ThisItem.Fornecedor))); Navigate(scrFicha, ScreenTransition.None)
        Children:
        - lblFoEmpresa:
            Control: Label
            Properties:
              Text: =ThisItem.Empresa & If(ThisItem.Ativo, "", "  (inativo)")
              X: =0
              Y: =0
              Width: =Parent.TemplateWidth * 0.22
              Height: =52
              Size: =11
              Color: =Cor.Tinta
              Font: =Fonte
              PaddingLeft: =0
              PaddingRight: =0
              PaddingTop: =0
              PaddingBottom: =0
              FontWeight: =FontWeight.Semibold
        - lblFoSegmentos:
            Control: Label
            Properties:
              Text: '=Concat(Filter(Vinculos, Fornecedor.Fornecedor = ThisItem.Fornecedor), Segmento.Nome & ": " & StatusCalculado & If(Especializado, " + Especializado", ""), "   ·   ")'
              X: =Parent.TemplateWidth * 0.22
              Y: =0
              Width: =Parent.TemplateWidth * 0.40
              Height: =52
              Size: =10
              Color: =Cor.Tinta
              Font: =Fonte
              PaddingLeft: =0
              PaddingRight: =0
              PaddingTop: =0
              PaddingBottom: =0
              Wrap: =true
        - lblFoResp:
            Control: Label
            Properties:
              Text: =Coalesce(ThisItem.Responsavel, "–")
              X: =Parent.TemplateWidth * 0.62
              Y: =0
              Width: =Parent.TemplateWidth * 0.14
              Height: =52
              Size: =10
              Color: =Cor.Tinta
              Font: =Fonte
              PaddingLeft: =0
              PaddingRight: =0
              PaddingTop: =0
              PaddingBottom: =0
        - lblFoTel:
