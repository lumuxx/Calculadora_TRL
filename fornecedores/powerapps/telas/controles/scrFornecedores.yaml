- conFornecedores:
    Control: GroupContainer
    Variant: ManualLayout
    Properties:
      X: =24
      Y: =92
      Width: =Parent.Width - 48
      Height: =Parent.Height - 92 - 24
      Fill: =Cor.Superficie
      BorderColor: =Cor.Linha
      BorderThickness: =1
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      DropShadow: =DropShadow.None
    Children:
    - lblFornTitulo:
        Control: Label
        Properties:
          Text: =If(IsBlank(varSegFiltro), "Fornecedores", "Fornecedores · " & varSegFiltro.Nome)
          X: =16
          Y: =14
          Width: =400
          Height: =30
          Size: =16
          Color: =Cor.Tinta
          Font: =Fonte
          PaddingLeft: =0
          PaddingRight: =0
          PaddingTop: =0
          PaddingBottom: =0
          FontWeight: =FontWeight.Bold
    - txtBuscaForn:
        Control: Classic/TextInput
        Properties:
          Default: =""
          HintText: ="Empresa, CNPJ ou responsável"
          X: =Parent.Width - 16 - 160 - 12 - 200 - 12 - 240
          Y: =12
          Width: =240
          Height: =36
          Size: =11
          Font: =Fonte
          BorderColor: =Cor.Linha
          BorderThickness: =1
          HoverBorderColor: =Cor.Suave
          FocusedBorderColor: =Cor.Destaque
          FocusedBorderThickness: =2
          RadiusTopLeft: =6
          RadiusTopRight: =6
          RadiusBottomLeft: =6
          RadiusBottomRight: =6
          Color: =Cor.Tinta
          Fill: =Cor.Superficie
          DelayOutput: =true
    - cbSegForn:
        Control: Classic/ComboBox
        Properties:
          Items: =Sort(Segmentos, Ordem)
          DisplayFields: =["Nome"]
          SearchFields: =["Nome"]
          SelectMultiple: =false
          InputTextPlaceholder: ="Todos os segmentos"
          IsSearchable: =true
          X: =Parent.Width - 16 - 160 - 12 - 200
          Y: =12
          Width: =200
          Height: =36
          Font: =Fonte
          Size: =11
          BorderColor: =Cor.Linha
          BorderThickness: =1
          ChevronBackground: =Cor.Superficie
          ChevronFill: =Cor.Suave
          SelectionFill: =Cor.Destaque
          SelectionColor: =Cor.Superficie
          DefaultSelectedItems: =If(IsBlank(varSegFiltro), Blank(), [varSegFiltro])
          OnChange: =Set(varSegFiltro, Self.Selected)
    - btnNovoForn:
        Control: Classic/Button
        Properties:
          Text: ="Novo fornecedor"
          X: =Parent.Width - 16 - 160
          Y: =12
          Width: =160
          Height: =36
