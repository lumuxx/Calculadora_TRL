          RadiusBottomRight: =6
          Size: =11
          FontWeight: =FontWeight.Semibold
          Font: =Fonte
    - lblSegNome:
        Control: Label
        Properties:
          Text: =Upper(ThisItem.Nome)
          X: =14
          Y: =10
          Width: =Parent.TemplateWidth - 40
          Height: =22
