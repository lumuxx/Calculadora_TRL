          Fill: =Cor.Ok
    - recSegBloq:
        Control: Rectangle
        Properties:
          X: =14 + (Parent.TemplateWidth - 40) * (CountRows(Filter(Vinculos, Segmento.Segmento = ThisItem.Segmento && StatusCalculado = "Em avaliação")) + CountRows(Filter(Vinculos, Segmento.Segmento = ThisItem.Segmento && StatusCalculado = "Homologado"))) / Max(1, CountRows(Filter(Vinculos, Segmento.Segmento = ThisItem.Segmento)))
