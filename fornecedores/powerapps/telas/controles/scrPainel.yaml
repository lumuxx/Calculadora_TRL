          OnSelect: =Set(varSegFiltro, If(varSegFiltro.Segmento = ThisItem.Segmento, Blank(), ThisItem))
          Fill: =Cor.Superficie
          Color: =Cor.Tinta
          BorderColor: =If(varSegFiltro.Segmento = ThisItem.Segmento, Cor.Destaque, Cor.Linha)
          BorderThickness: =If(varSegFiltro.Segmento = ThisItem.Segmento, 2, 1)
          HoverFill: =Cor.Superficie
