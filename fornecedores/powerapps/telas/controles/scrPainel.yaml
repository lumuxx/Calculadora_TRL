          Width: =(Parent.TemplateWidth - 40) * CountRows(Filter(Vinculos, Segmento.Segmento = ThisItem.Segmento && StatusCalculado = "Bloqueado")) / Max(1, CountRows(Filter(Vinculos, Segmento.Segmento = ThisItem.Segmento)))
