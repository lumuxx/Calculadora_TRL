          Width: =(Parent.TemplateWidth - 40) * CountRows(Filter(Vinculos, Segmento.Segmento = ThisItem.Segmento && StatusCalculado = "Homologado")) / Max(1, CountRows(Filter(Vinculos, Segmento.Segmento = ThisItem.Segmento)))
