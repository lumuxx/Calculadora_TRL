            =With({busca: Lower(Trim(txtBuscaPainel.Text))},
                Sort(
                    Sort(
                        Filter(Vinculos,
                            IsBlank(varSegFiltro) || Segmento.Segmento = varSegFiltro.Segmento,
                            drpStatusPainel.Selected.Value = "Todos os status"
