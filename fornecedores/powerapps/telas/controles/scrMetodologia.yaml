- btnRecalcSeg:
    Control: Classic/Button
    Properties:
      Text: ="recalc seg"
      X: =0
      Y: =0
      Width: =10
      Height: =10
      OnSelect: |-
        =ClearCollect(colVincSeg, Filter(Vinculos, Segmento.Segmento = locSeg.Segmento));
        With({caps: Filter(Capacidades, Segmento.Segmento = locSeg.Segmento && Ativa)},
            With({pesos: Sum(caps, Peso)},
                ForAll(colVincSeg As v,
                    With({av: Filter(AvaliacoesCapacidade, Vinculo.Vinculo = v.Vinculo)},
                        Patch(Vinculos, LookUp(Vinculos, Vinculo = v.Vinculo), {
                            NotaCapacidade: If(pesos > 0 && CountRows(av) > 0,
                                Round(Sum(caps As k,
                                    Switch(LookUp(av, Capacidade.Capacidade = k.Capacidade).Atendimento,
                                        "atende", k.Peso, "parcial", k.Peso / 2, 0)) / pesos * 5, 2))
                        })
                    )
                )
            )
        )
      Fill: =Cor.Superficie
      Color: =Cor.Tinta
      BorderColor: =Cor.Linha
      BorderThickness: =1
      HoverFill: =Cor.Afundado
      HoverColor: =Cor.Tinta
      HoverBorderColor: =Cor.Linha
      PressedFill: =Cor.Afundado
      PressedColor: =Cor.Tinta
      PressedBorderColor: =Cor.Linha
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      Size: =11
      FontWeight: =FontWeight.Semibold
      Font: =Fonte
      Visible: =false
