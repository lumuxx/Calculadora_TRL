<title>Qualificação de Fornecedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra de abas fixa no topo; cada aba é uma folha de inspeção — resumo em cima, detalhe em tabela embaixo. */
:root {
  --bg: #F1F3F6;
  --surface: #FFFFFF;
  --sunken: #E8EBF0;
  --ink: #161A22;
  --muted: #586172;
  --line: #D6DAE2;
  --accent: #3341B8;          /* azul de traçagem (tinta de marcação de usinagem) */
  --accent-ink: #FFFFFF;
  --ok: #2B7A4B;
  --spec: #0E7482;
  --warn: #A86400;
  --bad: #B3261E;
  --idle: #6B7280;
  --star: #D99A00;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1117; --surface: #161A22; --sunken: #1D222C; --ink: #E6E9EF; --muted: #98A1B1; --line: #2A303C;
    --accent: #8C99FF; --accent-ink: #0E1117; --ok: #5CC28A; --spec: #4EC3D2; --warn: #E3A63E; --bad: #F2786E; --idle: #8E96A4; --star: #F2B935;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1117; --surface: #161A22; --sunken: #1D222C; --ink: #E6E9EF; --muted: #98A1B1; --line: #2A303C;
  --accent: #8C99FF; --accent-ink: #0E1117; --ok: #5CC28A; --spec: #4EC3D2; --warn: #E3A63E; --bad: #F2786E; --idle: #8E96A4; --star: #F2B935;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--body); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 { font-size: 1.6rem; line-height: 1.1; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .06em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* ---------- topo ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-wrap: wrap; align-items: end; gap: 4px 24px; }
.brand { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; }
.brand small { font-size: .78rem; color: var(--muted); }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tabs a { padding: 8px 12px 10px; text-decoration: none; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--accent); }
.tabs a:hover { color: var(--ink); }
.who { margin-left: auto; padding-bottom: 10px; font-size: .78rem; color: var(--muted); }

main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 20px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.row.spread { justify-content: space-between; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }

/* ---------- botões e campos ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 7px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 9px; font-size: .82rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: .78rem; color: var(--muted); font-weight: 500; }
input[type=text], input[type=email], input[type=tel], input[type=date], input[type=number], input[type=search], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 9px; width: 100%; min-width: 0;
}
textarea { min-height: 76px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; }
.kpi b { font-family: var(--display); font-size: 2.2rem; line-height: 1; font-weight: 700; }
.kpi small { color: var(--muted); font-size: .78rem; }

/* ---------- status ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap;
  color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.st-homologado { --c: var(--ok); } .st-especializado { --c: var(--spec); } .st-bloqueado { --c: var(--bad); } .st-em-avaliacao { --c: var(--idle); }
.hint { font-size: .74rem; color: var(--warn); white-space: nowrap; }

/* ---------- régua 0–5 ---------- */
.gauge { display: grid; grid-template-columns: 1fr 2.6em; align-items: center; gap: 6px; min-width: 72px; }
.gauge .track { position: relative; height: 8px; background: var(--sunken); border-radius: 2px; overflow: hidden;
  background-image: repeating-linear-gradient(90deg, transparent 0 calc(20% - 1px), var(--line) calc(20% - 1px) 20%); }
.gauge .fill { position: absolute; inset: 0 auto 0 0; background: var(--b); border-radius: 2px; }
.gauge .v { font-family: var(--mono); font-size: .8rem; text-align: right; }
.b-hi { --b: var(--ok); } .b-mid { --b: var(--warn); } .b-lo { --b: var(--bad); }

/* ---------- tabelas ---------- */
.scroll { overflow-x: auto; min-width: 0; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.link { cursor: pointer; }
tbody tr.link:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
td.name { font-weight: 600; }
td.center, th.center { text-align: center; }

/* ---------- segmentos no painel ---------- */
.segs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.seg { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; cursor: pointer; text-align: left; }
.seg:hover, .seg[aria-pressed="true"] { border-color: var(--accent); }
.seg[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--accent); }
.seg .t { font-family: var(--display); font-weight: 700; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .04em; }
.stack { display: flex; height: 6px; border-radius: 2px; overflow: hidden; background: var(--sunken); }
.stack span { background: var(--c); }
.seg .meta { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); }

/* ---------- detalhe ---------- */
.crumb { font-size: .82rem; }
.crumb a { color: var(--accent); text-decoration: none; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 20px; }
.facts div { min-width: 0; overflow-wrap: anywhere; }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; }
.subtabs button { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.subtabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 20px; }
@media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
.capl { display: grid; gap: 0; }
.capl .it { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.capl .it:last-child { border-bottom: 0; }
.capl .peso { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.seg3 { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg3 button { border: 0; background: transparent; padding: 4px 9px; font-size: .78rem; cursor: pointer; color: var(--muted); }
.seg3 button + button { border-left: 1px solid var(--line); }
.seg3 button[aria-pressed="true"][data-v="atende"] { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); font-weight: 600; }
.seg3 button[aria-pressed="true"][data-v="parcial"] { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); font-weight: 600; }
.seg3 button[aria-pressed="true"][data-v="nao"] { background: var(--sunken); color: var(--ink); font-weight: 600; }
.seg3 button:disabled { cursor: default; }
.scorebox { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.score { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; }
.score b { font-family: var(--display); font-size: 1.7rem; line-height: 1; }
.score.global { border-color: var(--accent); }
.crit { font-size: .76rem; color: var(--muted); display: block; max-width: 22ch; }
.log { font-size: .82rem; display: grid; gap: 6px; }
.log div { border-left: 2px solid var(--line); padding-left: 10px; }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.note { font-size: .82rem; color: var(--muted); max-width: 70ch; }
.banner { border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); border-radius: var(--r); padding: 10px 14px; font-size: .86rem; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: var(--r); font-size: .86rem; z-index: 20; max-width: calc(100vw - 32px); }

dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; width: min(640px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgb(10 12 18 / .45); }
dialog form { padding: 20px; display: grid; gap: 14px; max-height: calc(100dvh - 64px); overflow-y: auto; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; }

/* ---------- estrelas (índice global 0–5) ---------- */
.stars { position: relative; display: inline-block; font-size: 1rem; line-height: 1; letter-spacing: 1px; white-space: nowrap; color: var(--line); }
.stars .on { position: absolute; inset: 0 auto 0 0; overflow: hidden; color: var(--star); }
.rating { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.stars.none { color: var(--muted); font-size: .8rem; letter-spacing: 0; }

@media (prefers-reduced-motion: no-preference) { .gauge .fill { transition: width .35s ease; } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Qualificação de Fornecedores</h1><small id="modo"></small></div>
    <nav class="tabs" aria-label="Seções">
      <a href="#painel" data-tab="painel">Painel</a>
      <a href="#fornecedores" data-tab="fornecedores">Fornecedores</a>
      <a href="#metodologia" data-tab="metodologia">Metodologia</a>
      <a href="#exportar" data-tab="exportar">Exportar</a>
    </nav>
    <div class="who" id="who"></div>
  </div>
</header>

<main id="app">
  <div class="empty">Carregando fornecedores…</div>
</main>

<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";

/* ================= dados ================= */
const COLLS = ["segmentos", "capacidades", "criterios", "fornecedores", "vinculos", "servicos"];
const STATUS = ["Em avaliação", "Homologado", "Bloqueado"];
const MIN_SERV_HOMOLOGADO = 5;   // "acima de 4 serviços"
// O status é calculado pelas regras (histórico de serviços). "Especializado" é o único item manual:
// um selo que soma ao status (ex.: Homologado + Especializado).
const especDe = v => v.especializado === true || (v.especializado == null && v.status === "Especializado");
const ATEND = [["atende", "Atende"], ["parcial", "Parcial"], ["nao", "Não atende"]];
const S = Object.fromEntries(COLLS.map(c => [c, new Map()]));
const LS_KEY = "qualificacao-fornecedores-v1";

let mode = "loading";            // db | local | offline
let DB = null, USER = null;
let perm = { write: false, admin: false };
let meName = "";
const loaded = new Set();

const ui = { tab: "painel", seg: "", status: "", busca: "", fornecedorId: null, vinculoId: null, buscaF: "", confirm: null };

/* ---------- gravação (uma escrita por vez em cada documento) ---------- */
const chains = new Map();
function queue(key, fn) {
  const p = (chains.get(key) || Promise.resolve()).then(fn, fn);
  chains.set(key, p.catch(() => {}));
  return p;
}
async function save(coll, id, data) {
  S[coll].set(id, data);
  if (mode === "local") { persistLocal(); render(); return; }
  render();
  try { await queue(coll + "/" + id, () => DB.collection(coll).doc(id).set(data)); }
  catch (e) { falha(e); }
}
async function remove(coll, id) {
  S[coll].delete(id);
  if (mode === "local") { persistLocal(); render(); return; }
  render();
  try { await queue(coll + "/" + id, () => DB.collection(coll).doc(id).delete()); }
  catch (e) { falha(e); }
}
function falha(e) {
  const c = e && e.code;
  if (c === "invalid_argument") { perm.write = false; perm.admin = false; toast("Você não tem permissão para alterar estes dados. A página ficou somente leitura."); }
  else if (c === "quota_exceeded") toast("O banco de dados atingiu o limite de registros. Exporte e arquive dados antigos.");
  else toast("Não foi possível salvar agora. Tente de novo em instantes.");
  render();
}
const novoId = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- modo local (fora do claude.ai) ---------- */
function persistLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(Object.fromEntries(COLLS.map(c => [c, Object.fromEntries(S[c])])))); } catch (e) {}
}
function loadObj(obj) { COLLS.forEach(c => { S[c].clear(); Object.entries(obj[c] || {}).forEach(([k, v]) => S[c].set(k, v)); }); }
async function startLocal() {
  mode = "local"; perm = { write: true, admin: true };
  let raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch (e) {}
  if (raw) { try { loadObj(JSON.parse(raw)); } catch (e) {} }
  else {
    try { const r = await fetch("seed.json"); if (r.ok) { loadObj(await r.json()); persistLocal(); } } catch (e) {}
  }
  COLLS.forEach(c => loaded.add(c));
  render();
}

/* ---------- modo compartilhado (claude.ai) ---------- */
async function startDb() {
  DB = await window.claude.use("db");
  USER = await window.claude.use("user");
  if (!DB) { mode = "offline"; render(); return; }
  mode = "db";
  const [canW, adm, me] = await Promise.all([
    USER ? USER.can("data.write") : null, USER ? USER.canEdit() : false, USER ? USER.me() : null]);
  perm.write = canW !== false;
  perm.admin = !!adm;
  meName = (me && me.name) || "";
  COLLS.forEach(c => {
    DB.collection(c).onSnapshot(snap => {
      S[c].clear();
      snap.docs.forEach(d => { if (d.exists) S[c].set(d.id, d.data()); });
      loaded.add(c);
      scheduleRender();
    }, () => { loaded.add(c); scheduleRender(); });
  });
  render();
}

/* ================= cálculos ================= */
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const avg = (a, f) => a.length ? sum(a, f) / a.length : null;
const byOrdem = (a, b) => (a.ordem ?? 999) - (b.ordem ?? 999) || String(a.nome).localeCompare(b.nome, "pt-BR");
const segmentos = () => [...S.segmentos].map(([id, d]) => ({ id, ...d })).sort(byOrdem);
const capsDo = segId => [...S.capacidades].map(([id, d]) => ({ id, ...d })).filter(c => c.segmentoId === segId && c.ativa !== false).sort(byOrdem);
const servicosDo = vId => [...S.servicos].map(([id, d]) => ({ id, ...d })).filter(s => s.vinculoId === vId).sort((a, b) => String(b.data).localeCompare(String(a.data)));
const criterios = (segId, dim) => [...S.criterios].map(([id, d]) => ({ id, ...d }))
  .filter(c => c.dimensao === dim && (dim === "Qualidade" ? c.segmentoId === segId : !c.segmentoId)).sort((a, b) => b.nota - a.nota);
const descNota = (segId, dim, nota) => (criterios(segId, dim).find(c => c.nota === nota) || {}).descricao || "";

function notaCapacidade(v) {
  const caps = capsDo(v.segmentoId);
  const av = v.capacidades || {};
  if (!caps.length || !caps.some(c => av[c.id])) return null;
  const pesos = sum(caps, c => c.peso);
  const pts = sum(caps, c => av[c.id] === "atende" ? c.peso : av[c.id] === "parcial" ? c.peso / 2 : 0);
  return pesos ? pts / pesos * 5 : null;
}
function indices(vId) {
  const h = servicosDo(vId);
  if (!h.length) return { n: 0, q: null, p: null, c: null, g: null, ultimo: null };
  const q = avg(h, s => s.q), p = avg(h, s => s.p), c = avg(h, s => s.c);
  return { n: h.length, q, p, c, g: (q + p + c) / 3, ultimo: h[0].data };
}
function statusPor(n, g) {
  if (n < 2) return "Em avaliação";
  if (g < 2) return "Bloqueado";
  if (n >= MIN_SERV_HOMOLOGADO && g > 2) return "Homologado";
  return "Em avaliação";
}
function motivo(ix) {
  const sv = `${ix.n} serviço${ix.n === 1 ? "" : "s"}`;
  if (ix.n < 2) return `${sv} avaliado${ix.n === 1 ? "" : "s"}; são precisos pelo menos 2 para sair de Em avaliação`;
  if (ix.g < 2) return `${sv}, índice global ${fmt(ix.g)}, abaixo de 2`;
  if (ix.n >= MIN_SERV_HOMOLOGADO && ix.g > 2) return `${sv}, índice global ${fmt(ix.g)}, acima de 2`;
  if (ix.n < MIN_SERV_HOMOLOGADO) return `${sv}, índice global ${fmt(ix.g)}; faltam ${MIN_SERV_HOMOLOGADO - ix.n} para poder ser Homologado`;
  return `${sv}, índice global ${fmt(ix.g)}; precisa ficar acima de 2 para ser Homologado`;
}
// reconstrói as mudanças de status serviço a serviço, em ordem de data
function linhaDoTempo(vId) {
  const h = servicosDo(vId).slice().reverse();
  const out = []; let q = 0, p = 0, c = 0, ant = "Em avaliação";
  h.forEach((sv, i) => {
    q += sv.q; p += sv.p; c += sv.c;
    const n = i + 1, g = (q + p + c) / (3 * n), st = statusPor(n, g);
    if (st !== ant) { out.push({ data: sv.data, status: st, n, g }); ant = st; }
  });
  return out;
}
function linhas() {
  return [...S.vinculos].map(([id, v]) => {
    const f = S.fornecedores.get(v.fornecedorId) || { empresa: "(fornecedor removido)" };
    const sg = S.segmentos.get(v.segmentoId) || { nome: "—" };
    const cap = notaCapacidade(v), ix = indices(id);
    return { id, v, f, fId: v.fornecedorId, seg: sg.nome, segId: v.segmentoId, status: statusPor(ix.n, ix.g), espec: especDe(v), cap, ix };
  });
}

/* ================= formatação ================= */
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const fmt = (n, d = 2) => n == null || isNaN(n) ? "–" : n.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const dataBR = s => s ? String(s).slice(0, 10).split("-").reverse().join("/") : "–";
const hoje = () => new Date().toISOString().slice(0, 10);
const stCls = s => "st-" + String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, "-");
const pill = s => `<span class="pill ${stCls(s)}">${esc(s)}</span>`;
const selo = l => pill(l.status) + (l.espec ? ` <span class="pill st-especializado" title="Selo definido manualmente">Especializado</span>` : "");
const band = n => n >= 3.5 ? "b-hi" : n >= 2 ? "b-mid" : "b-lo";
const estrelas = n => n == null
  ? `<span class="stars none" title="Sem serviço avaliado">–</span>`
  : `<span class="stars" role="img" aria-label="${fmt(n, 1)} de 5 estrelas" title="${fmt(n)} de 5">★★★★★<span class="on" style="width:${Math.max(0, Math.min(100, n / 5 * 100))}%" aria-hidden="true">★★★★★</span></span>`;
const gauge = n => n == null
  ? `<div class="gauge"><div class="track"></div><span class="v muted">–</span></div>`
  : `<div class="gauge ${band(n)}" title="${fmt(n)} de 5"><div class="track"><div class="fill" style="width:${Math.max(0, Math.min(100, n / 5 * 100))}%"></div></div><span class="v">${fmt(n, 1)}</span></div>`;

/* ================= render ================= */
let rq = 0, deferred = false;
function scheduleRender() {
  if (rq) return;
  rq = requestAnimationFrame(() => { rq = 0; render(); });
}
function render() {
  const a = document.activeElement;
  if (a && a.closest && a.closest("#app") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { deferred = true; return; }
  deferred = false;
  document.querySelectorAll(".tabs a").forEach(x => x.toggleAttribute("aria-current", x.dataset.tab === (ui.tab === "detalhe" ? "fornecedores" : ui.tab)));
  document.querySelectorAll(".tabs a[aria-current]").forEach(x => x.setAttribute("aria-current", "page"));
  document.getElementById("modo").textContent =
    mode === "db" ? "dados compartilhados com a equipe" : mode === "local" ? "dados salvos neste navegador" : "";
  document.getElementById("who").textContent =
    mode === "db" ? (perm.admin ? "Você pode editar a metodologia" : perm.write ? "Você pode registrar e editar" : "Somente leitura") : "";
  const app = document.getElementById("app");
  if (mode === "loading" || (mode === "db" && loaded.size < COLLS.length)) { app.innerHTML = `<div class="empty">Carregando fornecedores…</div>`; return; }
  if (mode === "offline") {
    app.innerHTML = `<div class="panel empty"><h2>Entre na sua conta para ver os fornecedores</h2><p class="note">Os cadastros e avaliações ficam salvos para toda a equipe e só aparecem para quem está conectado ao claude.ai com acesso a esta página.</p></div>`;
    return;
  }
  const view = { painel: vPainel, fornecedores: vFornecedores, detalhe: vDetalhe, metodologia: vMetodologia, exportar: vExportar }[ui.tab] || vPainel;
  app.innerHTML = view();
}
document.addEventListener("focusout", () => { if (deferred) setTimeout(() => { if (deferred) render(); }, 0); });

/* ---------- Painel ---------- */
function vPainel() {
  const L = linhas();
  if (!L.length) return vazio();
  const comServ = L.filter(l => l.ix.n > 0);
  const media = avg(comServ, l => l.ix.g);
  const ativos = [...S.fornecedores.values()].filter(f => f.ativo !== false).length;
  const homol = L.filter(l => l.status === "Homologado").length;
  const nEspec = L.filter(l => l.espec).length;
  const nServ = S.servicos.size;

  const segCards = segmentos().map(sg => {
    const ls = L.filter(l => l.segId === sg.id);
    const cs = ls.filter(l => l.ix.n > 0);
    const bars = STATUS.map(st => { const k = ls.filter(l => l.status === st).length; return k ? `<span class="${stCls(st)}" style="width:${k / ls.length * 100}%" title="${esc(st)}: ${k}"></span>` : ""; }).join("");
    return `<button class="seg" type="button" data-act="filtro-seg" data-id="${esc(sg.id)}" aria-pressed="${ui.seg === sg.id}">
      <span class="t">${esc(sg.nome)}</span>
      <div class="stack">${bars}</div>
      <span class="meta"><span>${ls.length} fornecedor${ls.length === 1 ? "" : "es"}</span><span>média global <b class="num">${fmt(avg(cs, l => l.ix.g))}</b></span></span>
    </button>`;
  }).join("");

  const q = ui.busca.trim().toLowerCase();
  const vis = L.filter(l => (!ui.seg || l.segId === ui.seg) && (!ui.status || (ui.status === "Especializado" ? l.espec : l.status === ui.status)) && (!q || String(l.f.empresa).toLowerCase().includes(q)))
    .sort((a, b) => (b.ix.g ?? -1) - (a.ix.g ?? -1) || (b.cap ?? -1) - (a.cap ?? -1) || String(a.f.empresa).localeCompare(b.f.empresa, "pt-BR"));

  const rows = vis.map(l => `<tr class="link" data-act="abrir" data-f="${esc(l.fId)}" data-v="${esc(l.id)}" tabindex="0">
      <td class="name">${esc(l.f.empresa)}</td>
      <td>${esc(l.seg)}</td>
      <td><div class="row" style="gap:4px" title="${esc(motivo(l.ix))}">${selo(l)}</div></td>
      <td>${gauge(l.cap)}</td><td>${gauge(l.ix.q)}</td><td>${gauge(l.ix.p)}</td><td>${gauge(l.ix.c)}</td>
      <td>${l.ix.g == null ? `<span class="muted" title="Sem serviço avaliado">–</span>` : `<div class="rating">${estrelas(l.ix.g)}<b class="num">${fmt(l.ix.g)}</b></div>`}</td>
      <td class="center"><b class="num">${l.ix.n}</b>${l.ix.ultimo ? `<div class="num muted" style="font-size:.74rem;white-space:nowrap">últ. ${dataBR(l.ix.ultimo)}</div>` : ""}</td>
    </tr>`).join("");

  return `
  <section class="kpis" aria-label="Resumo">
    <div class="kpi"><span class="label">Média global</span><b class="num">${fmt(media)}</b><small>de 5, entre ${comServ.length} fornecedor${comServ.length === 1 ? "" : "es"} com serviço avaliado</small></div>
    <div class="kpi"><span class="label">Fornecedores ativos</span><b class="num">${ativos}</b><small>em ${S.segmentos.size} segmentos</small></div>
    <div class="kpi"><span class="label">Homologados</span><b class="num">${homol}</b><small>${nEspec} com selo Especializado</small></div>
    <div class="kpi"><span class="label">Serviços avaliados</span><b class="num">${nServ}</b><small>qualidade, prazo e custo</small></div>
  </section>
  <section class="segs" aria-label="Segmentos">${segCards}</section>
  <section class="panel">
    <div class="row spread">
      <h2>Ranking${ui.seg ? " · " + esc((S.segmentos.get(ui.seg) || {}).nome) : ""}</h2>
      <div class="row">
        <input type="search" id="buscaPainel" placeholder="Buscar fornecedor" value="${esc(ui.busca)}" aria-label="Buscar fornecedor" style="width:200px">
        <select id="filtroStatus" aria-label="Filtrar por status" style="width:auto">
          <option value="">Todos os status</option>${[...STATUS, "Especializado"].map(s => `<option ${ui.status === s ? "selected" : ""}>${s}</option>`).join("")}
        </select>
        ${selSegmento("filtroSegPainel")}
      </div>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>Fornecedor</th><th>Segmento</th><th>Status</th><th>Capacidade</th><th>Qualidade</th><th>Prazo</th><th>Custo</th><th>Global</th><th class="center">Serviços</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="9" class="muted">Nenhum fornecedor com esses filtros.</td></tr>`}</tbody>
    </table></div>
    <p class="note">Todas as notas vão de 0 a 5. <b>Global</b> = média de qualidade, prazo e custo de todos os serviços; as estrelas mostram a mesma nota (1 estrela = 1 ponto, preenchimento proporcional). <b>Capacidade</b> = soma das notas ponderadas pelos pesos do segmento. O <b>status</b> é calculado automaticamente pelas regras da aba Metodologia (passe o mouse sobre ele para ver o motivo). <b>Especializado</b> é um selo manual que pode acompanhar qualquer status.</p>
  </section>`;
}
function vazio() {
  return `<div class="panel empty"><h2>Nenhum fornecedor cadastrado ainda</h2>
    <p class="note">Cadastre o primeiro fornecedor e escolha os segmentos em que ele atua. A capacidade técnica e o histórico de serviços aparecem na ficha dele.</p>
    ${perm.write ? `<button class="btn primary" type="button" data-act="novo-fornecedor">Cadastrar fornecedor</button>` : ""}</div>`;
}

function selSegmento(id) {
  return `<select id="${id}" class="filtro-seg" aria-label="Filtrar por segmento" style="width:auto">
    <option value="">Todos os segmentos</option>${segmentos().map(sg => `<option value="${esc(sg.id)}" ${ui.seg === sg.id ? "selected" : ""}>${esc(sg.nome)}</option>`).join("")}
  </select>`;
}

/* ---------- Fornecedores ---------- */
function vFornecedores() {
  const L = linhas();
  const q = ui.buscaF.trim().toLowerCase();
  const fs = [...S.fornecedores].map(([id, f]) => ({ id, ...f }))
    .filter(f => !q || [f.empresa, f.responsavel, f.cnpj].some(x => String(x || "").toLowerCase().includes(q)))
    .filter(f => !ui.seg || L.some(l => l.fId === f.id && l.segId === ui.seg))
    .sort((a, b) => String(a.empresa).localeCompare(b.empresa, "pt-BR"));
  const rows = fs.map(f => {
    const vs = L.filter(l => l.fId === f.id);
    return `<tr class="link" data-act="abrir" data-f="${esc(f.id)}" tabindex="0">
      <td class="name">${esc(f.empresa)}${f.ativo === false ? ` <span class="muted">(inativo)</span>` : ""}</td>
      <td>${vs.map(l => `<div class="row" style="gap:6px">${esc(l.seg)} ${selo(l)}</div>`).join("") || `<span class="muted">sem segmento</span>`}</td>
      <td>${esc(f.responsavel) || `<span class="muted">–</span>`}</td>
      <td class="num">${esc(f.telefone) || `<span class="muted">–</span>`}</td>
      <td>${f.telefone || f.endereco || f.email ? "" : `<span class="hint">contato a completar</span>`}</td>
    </tr>`;
  }).join("");
  return `<section class="panel">
    <div class="row spread"><h2>Fornecedores${ui.seg ? " · " + esc((S.segmentos.get(ui.seg) || {}).nome) : ""}</h2>
      <div class="row"><input type="search" id="buscaForn" placeholder="Empresa, CNPJ ou responsável" value="${esc(ui.buscaF)}" aria-label="Buscar" style="width:240px">
      ${selSegmento("filtroSegForn")}
      ${perm.write ? `<button class="btn primary" type="button" data-act="novo-fornecedor">Novo fornecedor</button>` : ""}</div></div>
    <div class="scroll"><table><thead><tr><th>Empresa</th><th>Segmentos e status</th><th>Responsável</th><th>Telefone</th><th></th></tr></thead>
    <tbody>${rows || `<tr><td colspan="5" class="muted">Nenhum fornecedor encontrado.</td></tr>`}</tbody></table></div>
  </section>`;
}

/* ---------- Ficha do fornecedor ---------- */
function vDetalhe() {
  const f = S.fornecedores.get(ui.fornecedorId);
  if (!f) { ui.tab = "fornecedores"; return vFornecedores(); }
  const L = linhas().filter(l => l.fId === ui.fornecedorId).sort((a, b) => a.seg.localeCompare(b.seg, "pt-BR"));
  if (!L.find(l => l.id === ui.vinculoId)) ui.vinculoId = L[0] ? L[0].id : null;
  const l = L.find(x => x.id === ui.vinculoId);

  const facts = [["Responsável", f.responsavel], ["Telefone", f.telefone], ["E-mail", f.email], ["CNPJ", f.cnpj], ["Endereço", f.endereco]]
    .map(([k, v]) => `<div><div class="label">${k}</div>${v ? esc(v) : `<span class="muted">–</span>`}</div>`).join("");

  return `
  <div class="crumb"><a href="#fornecedores">Fornecedores</a> / ${esc(f.empresa)}</div>
  <section class="panel">
    <div class="row spread"><h2 style="font-size:1.7rem">${esc(f.empresa)}${f.ativo === false ? ` <span class="muted" style="font-size:1rem">(inativo)</span>` : ""}</h2>
      ${perm.write ? `<button class="btn" type="button" data-act="editar-fornecedor">Editar cadastro</button>` : ""}</div>
    <div class="facts">${facts}</div>
    ${f.observacoes ? `<p class="note">${esc(f.observacoes)}</p>` : ""}
  </section>
  ${L.length > 1 ? `<div class="subtabs" role="group" aria-label="Segmento">${L.map(x => `<button type="button" data-act="vinculo" data-id="${esc(x.id)}" aria-pressed="${x.id === ui.vinculoId}">${esc(x.seg)}</button>`).join("")}</div>` : ""}
  ${l ? vVinculo(l) : `<div class="panel empty">Este fornecedor ainda não está ligado a nenhum segmento.${perm.write ? ` <button class="btn" type="button" data-act="editar-fornecedor">Escolher segmentos</button>` : ""}</div>`}`;
}

function vVinculo(l) {
  const caps = capsDo(l.segId);
  const av = l.v.capacidades || {};
  const capRows = caps.map(c => `<div class="it">
      <div><div>${esc(c.nome)}</div><div class="peso">peso ${fmt(c.peso, 1)}</div></div>
      <div class="seg3" role="group" aria-label="${esc(c.nome)}">${ATEND.map(([v, t]) =>
        `<button type="button" data-act="cap" data-cap="${esc(c.id)}" data-v="${v}" aria-pressed="${av[c.id] === v}" ${perm.write ? "" : "disabled"}>${t}</button>`).join("")}</div>
    </div>`).join("");

  const serv = servicosDo(l.id);
  const servRows = serv.map(s => `<tr>
      <td class="num">${dataBR(s.data)}</td>
      <td><b>${esc(s.projeto)}</b><div class="muted" style="font-size:.8rem">${esc(s.projetista)}</div>${s.relato ? `<div style="font-size:.82rem;max-width:40ch">${esc(s.relato)}</div>` : ""}</td>
      <td><b class="num">${s.q}</b><span class="crit">${esc(descNota(l.segId, "Qualidade", s.q))}</span></td>
      <td><b class="num">${s.p}</b><span class="crit">${esc(descNota(l.segId, "Prazo", s.p))}</span></td>
      <td><b class="num">${s.c}</b><span class="crit">${esc(descNota(l.segId, "Custo", s.c))}</span></td>
      <td>${perm.write ? (ui.confirm === s.id
        ? `<button class="btn small danger" type="button" data-act="excluir-servico" data-id="${esc(s.id)}">Confirmar exclusão</button>`
        : `<button class="btn small" type="button" data-act="pedir-confirmacao" data-id="${esc(s.id)}" aria-label="Excluir serviço">Excluir</button>`) : ""}</td>
    </tr>`).join("");

  const tl = linhaDoTempo(l.id).reverse().map(t =>
    `<div><span class="num">${dataBR(t.data)}</span> · ${pill(t.status)} <span class="muted">ao chegar a ${t.n} serviço${t.n === 1 ? "" : "s"}, índice global ${fmt(t.g)}</span></div>`).join("");
  const selos = (l.v.historicoStatus || []).filter(h => h.especializado != null).slice().reverse().map(h =>
    `<div><span class="num">${dataBR(h.data)}</span> · ${h.especializado ? "selo Especializado marcado" : "selo Especializado removido"}${h.texto ? " — " + esc(h.texto) : ""}</div>`).join("");

  return `
  <section class="panel">
    <div class="row spread">
      <div class="row"><h3>${esc(l.seg)}</h3>${selo(l)}</div>
      <label class="row" style="gap:8px"><input type="checkbox" id="chkEspec" data-act-change="espec" ${l.espec ? "checked" : ""} ${perm.write ? "" : "disabled"}> Especializado <span class="muted" style="font-size:.78rem">(manual)</span></label>
    </div>
    <p class="note" style="margin:0">Status calculado automaticamente: ${esc(motivo(l.ix))}.</p>
    <div class="scorebox">
      <div class="score"><span class="label">Capacidade</span><b class="num">${fmt(l.cap, 1)}</b>${gauge(l.cap)}</div>
      <div class="score"><span class="label">Qualidade</span><b class="num">${fmt(l.ix.q)}</b>${gauge(l.ix.q)}</div>
      <div class="score"><span class="label">Prazo</span><b class="num">${fmt(l.ix.p)}</b>${gauge(l.ix.p)}</div>
      <div class="score"><span class="label">Custo</span><b class="num">${fmt(l.ix.c)}</b>${gauge(l.ix.c)}</div>
      <div class="score global"><span class="label">Índice global</span><b class="num">${fmt(l.ix.g)}</b><span class="muted" style="font-size:.78rem">${l.ix.n} serviço${l.ix.n === 1 ? "" : "s"}</span></div>
    </div>
    ${tl || selos ? `<div class="grid2">
      ${tl ? `<div class="log"><span class="label">Mudanças de status</span>${tl}</div>` : ""}
      ${selos ? `<div class="log"><span class="label">Selo Especializado</span>${selos}</div>` : ""}
    </div>` : ""}
  </section>
  <div class="two">
    <section class="panel">
      <div class="row spread"><h3>Capacidade técnica</h3><span class="num muted">${fmt(l.cap, 1)} / 5</span></div>
      ${caps.length ? `<div class="capl">${capRows}</div>` : `<p class="note">Nenhuma capacidade cadastrada para ${esc(l.seg)}. O administrador cadastra na aba Metodologia.</p>`}
      <p class="note">Atende = peso cheio · Parcial = metade do peso · Não atende = 0.</p>
    </section>
    <section class="panel">
      <div class="row spread"><h3>Histórico de serviços</h3>${perm.write ? `<button class="btn primary" type="button" data-act="novo-servico">Registrar serviço</button>` : ""}</div>
      ${serv.length ? `<div class="scroll"><table><thead><tr><th>Orçamento</th><th>Projeto</th><th>Qualidade</th><th>Prazo</th><th>Custo</th><th></th></tr></thead><tbody>${servRows}</tbody></table></div>`
        : `<p class="note">Nenhum serviço registrado. Ao concluir um serviço, registre o projeto e escolha a situação de qualidade, prazo e custo; as médias se atualizam sozinhas.</p>`}
    </section>
  </div>`;
}

/* ---------- Metodologia ---------- */
function vMetodologia() {
  const ro = !perm.admin;
  const segs = segmentos();
  const blocos = segs.map(sg => {
    const caps = capsDo(sg.id);
    const pesos = sum(caps, c => c.peso);
    const crit = criterios(sg.id, "Qualidade");
    return `<section class="panel">
      <div class="row spread"><h3>${esc(sg.nome)}</h3><span class="muted" style="font-size:.82rem">soma dos pesos: <b class="num">${fmt(pesos, 1)}</b></span></div>
      <div class="two">
        <div><div class="label" style="margin-bottom:6px">Capacidades exigidas</div>
          <div class="scroll"><table><thead><tr><th>Capacidade</th><th>Peso</th>${ro ? "" : "<th></th>"}</tr></thead><tbody>
          ${caps.map(c => `<tr><td>${ro ? esc(c.nome) : `<input type="text" data-edit="capacidades" data-id="${esc(c.id)}" data-k="nome" value="${esc(c.nome)}" aria-label="Nome da capacidade">`}</td>
            <td style="width:110px">${ro ? `<span class="num">${fmt(c.peso, 1)}</span>` : `<select data-edit="capacidades" data-id="${esc(c.id)}" data-k="peso" aria-label="Peso">${[0.5, 1, 1.5, 2].map(p => `<option value="${p}" ${c.peso === p ? "selected" : ""}>${fmt(p, 1)}</option>`).join("")}</select>`}</td>
            ${ro ? "" : `<td><button class="btn small" type="button" data-act="desativar-cap" data-id="${esc(c.id)}">Remover</button></td>`}</tr>`).join("")}
          </tbody></table></div>
          ${ro ? "" : `<div class="row" style="margin-top:8px"><input type="text" id="novaCap-${esc(sg.id)}" placeholder="Nova capacidade" aria-label="Nova capacidade" style="flex:1"><button class="btn small" type="button" data-act="add-cap" data-id="${esc(sg.id)}">Adicionar</button></div>`}
        </div>
        <div><div class="label" style="margin-bottom:6px">Índice de qualidade</div>
          ${critTabela(crit, ro, sg.id, "Qualidade")}
        </div>
      </div>
    </section>`;
  }).join("");

  return `
  <section class="panel">
    <h2>Metodologia de qualificação</h2>
    <p class="note">Estas regras valem para todos os fornecedores. A capacidade técnica e o índice de qualidade mudam por segmento; prazo e custo são iguais para todos. ${ro ? "Somente editores da página alteram a metodologia." : "Alterações são salvas assim que você sai do campo."}</p>
    <div class="grid2">
      <div><div class="label" style="margin-bottom:6px">Índice de prazo (todos os segmentos)</div>${critTabela(criterios(null, "Prazo"), ro, null, "Prazo")}</div>
      <div><div class="label" style="margin-bottom:6px">Índice de custo (todos os segmentos)</div>${critTabela(criterios(null, "Custo"), ro, null, "Custo")}</div>
    </div>
    <div class="banner"><b>Status</b> (calculado automaticamente pelo histórico de serviços, a cada serviço registrado ou excluído):
      <ul style="margin:6px 0 0;padding-left:18px">
        <li>menos de 2 serviços → <b>Em avaliação</b></li>
        <li>índice global abaixo de 2 → <b>Bloqueado</b></li>
        <li>mais de 4 serviços (5 ou mais) e índice global acima de 2 → <b>Homologado</b></li>
        <li>demais casos (2 a 4 serviços com índice global de 2 ou mais) → <b>Em avaliação</b></li>
      </ul>
      <div style="margin-top:6px"><b>Especializado</b> é um selo manual, marcado na ficha do fornecedor. Ele soma ao status: um fornecedor pode ser Homologado e Especializado ao mesmo tempo.</div></div>
  </section>
  ${blocos}
  ${ro ? "" : `<section class="panel"><h3>Novo segmento</h3><div class="row"><input type="text" id="novoSeg" placeholder="Ex.: Corte a laser" aria-label="Nome do segmento" style="flex:1;max-width:320px"><button class="btn" type="button" data-act="add-seg">Adicionar segmento</button></div></section>`}`;
}
function critTabela(crit, ro, segId, dim) {
  const notas = [5, 4, 3, 2, 1, 0];
  return `<div class="scroll"><table><thead><tr><th style="width:56px">Nota</th><th>Situação</th></tr></thead><tbody>
    ${notas.map(n => {
      const c = crit.find(x => x.nota === n);
      const val = c ? c.descricao : "";
      return `<tr><td class="num center"><b>${n}</b></td><td>${ro ? (val ? esc(val) : `<span class="hint">sem descrição</span>`)
        : `<input type="text" data-crit="${dim}" data-seg="${esc(segId || "")}" data-nota="${n}" ${c ? `data-id="${esc(c.id)}"` : ""} value="${esc(val)}" placeholder="Descrever a situação que vale ${n}" aria-label="Situação nota ${n}">`}</td></tr>`;
    }).join("")}
  </tbody></table></div>`;
}

/* ---------- Exportar ---------- */
const TABELAS = {
  "Fornecedores": () => [["Empresa", "CNPJ", "Telefone", "Email", "Endereco", "Responsavel", "Ativo", "Observacoes"],
    ...[...S.fornecedores.values()].map(f => [f.empresa, f.cnpj, f.telefone, f.email, f.endereco, f.responsavel, f.ativo !== false ? "Sim" : "Não", f.observacoes])],
  "FornecedorSegmento": () => [["Vinculo", "Fornecedor", "Segmento", "Status", "Especializado", "NotaCapacidade", "MediaQualidade", "MediaPrazo", "MediaCusto", "IndiceGlobal", "QtdServicos", "UltimoServico"],
    ...linhas().map(l => [l.f.empresa + " — " + l.seg, l.f.empresa, l.seg, l.status, l.espec ? "Sim" : "Não", r2(l.cap), r2(l.ix.q), r2(l.ix.p), r2(l.ix.c), r2(l.ix.g), l.ix.n, l.ix.ultimo || ""])],
  "AvaliacaoCapacidade": () => [["Vinculo", "Capacidade", "Atendimento", "Nota"],
    ...linhas().flatMap(l => capsDo(l.segId).filter(c => (l.v.capacidades || {})[c.id]).map(c => {
      const a = l.v.capacidades[c.id];
      return [l.f.empresa + " — " + l.seg, c.nome, { atende: "Atende", parcial: "Atende parcialmente", nao: "Não atende" }[a], a === "atende" ? c.peso : a === "parcial" ? c.peso / 2 : 0];
    }))],
  "HistoricoServicos": () => [["Projeto", "Vinculo", "DataOrcamento", "Projetista", "Relato", "ValorOrcado", "DataPrevista", "DataEntrega", "NotaQualidade", "NotaPrazo", "NotaCusto"],
    ...[...S.servicos.values()].map(s => { const l = linhas().find(x => x.id === s.vinculoId); return [s.projeto, l ? l.f.empresa + " — " + l.seg : "", s.data, s.projetista, s.relato, s.valor ?? "", s.dataPrevista || "", s.dataEntrega || "", s.q, s.p, s.c]; })],
  "Capacidades": () => [["Capacidade", "Segmento", "Peso", "Ordem"],
    ...segmentos().flatMap(sg => capsDo(sg.id).map(c => [c.nome, sg.nome, c.peso, c.ordem ?? ""]))],
  "CriteriosQualificacao": () => [["Descricao", "Segmento", "Dimensao", "Nota"],
    ...[...S.criterios.values()].map(c => [c.descricao, c.segmentoId ? (S.segmentos.get(c.segmentoId) || {}).nome : "", c.dimensao, c.nota])],
};
const r2 = n => n == null ? "" : Math.round(n * 100) / 100;
function csv(rows) { return "﻿" + rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\r\n"); }
function vExportar() {
  return `<section class="panel">
    <h2>Exportar para o Dataverse</h2>
    <p class="note">Cada botão baixa uma tabela em CSV, com as mesmas colunas das tabelas propostas para o Dataverse. Importe nesta ordem: Capacidades e CritériosQualificação, Fornecedores, FornecedorSegmento, AvaliacaoCapacidade e HistoricoServicos. Em make.powerapps.com: Tabelas → abra a tabela → Importar → Importar dados do Excel/CSV.</p>
    <div class="row">${Object.keys(TABELAS).map(t => `<button class="btn" type="button" data-act="exportar" data-id="${t}">${t}.csv</button>`).join("")}</div>
    <p class="note" id="exportMsg"></p>
  </section>`;
}
async function exportar(nome) {
  const rows = TABELAS[nome]();
  const txt = csv(rows);
  const dl = window.claude ? await window.claude.use("downloads") : null;
  if (dl) {
    try { await dl.save({ filename: nome + ".csv", data: txt }); toast(nome + ".csv salvo"); }
    catch (e) { if (e && e.code !== "declined") toast("Não foi possível baixar o arquivo aqui."); }
    return;
  }
  if (!window.claude) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv" }));
    a.download = nome + ".csv"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    return;
  }
  toast("O download não está disponível nesta visualização.");
}

/* ================= diálogos ================= */
const dlg = document.getElementById("dlg"), dlgForm = document.getElementById("dlgForm");
let onSubmit = null;
function abrirDialogo(html, submit) {
  dlgForm.innerHTML = html;
  onSubmit = submit;
  dlg.showModal();
  const first = dlgForm.querySelector("input,select,textarea");
  if (first) first.focus();
}
dlgForm.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.submitter && e.submitter.value === "cancel") { dlg.close(); return; }
  if (onSubmit && (await onSubmit(new FormData(dlgForm))) !== false) dlg.close();
});
const botoes = rotulo => `<div class="row" style="justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn primary" value="ok">${rotulo}</button></div>`;

function dlgFornecedor(id) {
  const f = id ? S.fornecedores.get(id) : { ativo: true };
  const atuais = new Set([...S.vinculos.values()].filter(v => v.fornecedorId === id).map(v => v.segmentoId));
  abrirDialogo(`
    <h2>${id ? "Editar fornecedor" : "Novo fornecedor"}</h2>
    <div class="grid2">
      <label class="field"><span>Empresa *</span><input type="text" name="empresa" id="fEmpresa" required value="${esc(f.empresa)}"></label>
      <label class="field"><span>CNPJ</span><input type="text" name="cnpj" id="fCnpj" value="${esc(f.cnpj)}" placeholder="00.000.000/0000-00"></label>
      <label class="field"><span>Responsável no fornecedor</span><input type="text" name="responsavel" id="fResp" value="${esc(f.responsavel)}"></label>
      <label class="field"><span>Telefone</span><input type="tel" name="telefone" id="fTel" value="${esc(f.telefone)}"></label>
      <label class="field"><span>E-mail</span><input type="email" name="email" id="fEmail" value="${esc(f.email)}"></label>
    </div>
    <label class="field"><span>Endereço</span><input type="text" name="endereco" id="fEnd" value="${esc(f.endereco)}"></label>
    <fieldset class="field" style="border:0;padding:0;margin:0"><span>Segmentos em que atua</span>
      <div class="checks">${segmentos().map(sg => `<label><input type="checkbox" name="seg" value="${esc(sg.id)}" ${atuais.has(sg.id) ? "checked" : ""}> ${esc(sg.nome)}</label>`).join("")}</div>
      ${id ? `<span class="note">Desmarcar um segmento não apaga o histórico: para tirar um fornecedor de uso, mude o status para Bloqueado ou marque-o como inativo.</span>` : ""}
    </fieldset>
    <label class="field"><span>Observações</span><textarea name="observacoes" id="fObs">${esc(f.observacoes)}</textarea></label>
    <label class="row" style="gap:6px"><input type="checkbox" name="ativo" id="fAtivo" ${f.ativo !== false ? "checked" : ""}> Fornecedor ativo</label>
    ${botoes(id ? "Salvar" : "Cadastrar")}`,
  async fd => {
    const empresa = String(fd.get("empresa") || "").trim();
    if (!empresa) return false;
    const fid = id || novoId("f");
    const doc = { ...(id ? clone(f) : {}), empresa, cnpj: fd.get("cnpj").trim(), responsavel: fd.get("responsavel").trim(), telefone: fd.get("telefone").trim(),
      email: fd.get("email").trim(), endereco: fd.get("endereco").trim(), observacoes: fd.get("observacoes").trim(), ativo: fd.get("ativo") === "on" };
    await save("fornecedores", fid, doc);
    for (const sid of fd.getAll("seg")) {
      if (!atuais.has(sid)) await save("vinculos", novoId("v"), { fornecedorId: fid, segmentoId: sid, especializado: false, capacidades: {}, historicoStatus: [] });
    }
    ui.tab = "detalhe"; ui.fornecedorId = fid; history.replaceState(null, "", "#fornecedores");
    toast(id ? "Cadastro atualizado" : "Fornecedor cadastrado");
    render();
  });
}

function dlgServico(l) {
  const opts = dim => {
    const cs = criterios(l.segId, dim);
    const lista = cs.length ? cs : [5, 4, 3, 2, 1, 0].map(n => ({ nota: n, descricao: "critério ainda não definido" }));
    return `<option value="">Escolha a situação…</option>` + lista.map(c => `<option value="${c.nota}">${c.nota} – ${esc(c.descricao)}</option>`).join("");
  };
  abrirDialogo(`
    <h2>Registrar serviço</h2>
    <p class="note" style="margin:0">${esc(l.f.empresa)} · ${esc(l.seg)}</p>
    <div class="grid2">
      <label class="field"><span>Projeto *</span><input type="text" name="projeto" id="sProjeto" required placeholder="Ex.: CORAL-SOL"></label>
      <label class="field"><span>Data do orçamento *</span><input type="date" name="data" id="sData" required value="${hoje()}"></label>
      <label class="field"><span>Projetista</span><input type="text" name="projetista" id="sProj" value="${esc(meName)}"></label>
      <label class="field"><span>Valor orçado (R$)</span><input type="number" name="valor" id="sValor" min="0" step="0.01"></label>
      <label class="field"><span>Entrega prevista</span><input type="date" name="prevista" id="sPrev"></label>
      <label class="field"><span>Entrega real</span><input type="date" name="entrega" id="sEnt"></label>
    </div>
    <label class="field"><span>Índice de qualidade *</span><select name="q" id="sQ" required>${opts("Qualidade")}</select></label>
    <label class="field"><span>Índice de prazo *</span><select name="p" id="sP" required>${opts("Prazo")}</select></label>
    <label class="field"><span>Índice de custo *</span><select name="c" id="sC" required>${opts("Custo")}</select></label>
    <label class="field"><span>Relato</span><textarea name="relato" id="sRelato" placeholder="O que aconteceu no serviço, ajustes necessários, contato com o fornecedor…"></textarea></label>
    ${botoes("Registrar")}`,
  async fd => {
    const num = k => fd.get(k) === "" ? null : Number(fd.get(k));
    await save("servicos", novoId("s"), {
      vinculoId: l.id, projeto: fd.get("projeto").trim(), data: fd.get("data"), projetista: fd.get("projetista").trim(),
      relato: fd.get("relato").trim(), valor: num("valor"), dataPrevista: fd.get("prevista") || null, dataEntrega: fd.get("entrega") || null,
      q: num("q"), p: num("p"), c: num("c") });
    toast("Serviço registrado");
  });
  // sugere o índice de prazo pelas datas
  const sug = () => {
    const a = dlgForm.querySelector("#sPrev").value, b = dlgForm.querySelector("#sEnt").value;
    if (!a || !b) return;
    const d = Math.round((new Date(b) - new Date(a)) / 864e5);
    const n = d <= 0 ? 5 : d === 1 ? 4 : d <= 3 ? 3 : d <= 7 ? 2 : 1;
    dlgForm.querySelector("#sP").value = String(n);
  };
  dlgForm.querySelector("#sPrev").addEventListener("change", sug);
  dlgForm.querySelector("#sEnt").addEventListener("change", sug);
}


/* ================= eventos ================= */
let toastT = 0;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200);
}
function linhaAtual() { return linhas().find(x => x.id === ui.vinculoId); }

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el || !document.getElementById("app").contains(el)) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act !== "pedir-confirmacao" && act !== "excluir-servico") ui.confirm = null;
  switch (act) {
    case "filtro-seg": ui.seg = ui.seg === id ? "" : id; render(); break;
    case "abrir": ui.fornecedorId = el.dataset.f; ui.vinculoId = el.dataset.v || null; ui.tab = "detalhe"; history.replaceState(null, "", "#fornecedores"); render(); window.scrollTo(0, 0); break;
    case "vinculo": ui.vinculoId = id; render(); break;
    case "novo-fornecedor": dlgFornecedor(null); break;
    case "editar-fornecedor": dlgFornecedor(ui.fornecedorId); break;
    case "novo-servico": { const l = linhaAtual(); if (l) dlgServico(l); break; }
    case "pedir-confirmacao": ui.confirm = id; render(); break;
    case "excluir-servico": ui.confirm = null; await remove("servicos", id); toast("Serviço excluído"); break;
    case "cap": {
      const l = linhaAtual(); if (!l || !perm.write) break;
      const v = clone(l.v); v.capacidades = v.capacidades || {};
      v.capacidades[el.dataset.cap] = el.dataset.v;
      await save("vinculos", l.id, v); break;
    }
    case "exportar": exportar(id); break;
    case "desativar-cap": { const c = S.capacidades.get(id); if (c) await save("capacidades", id, { ...clone(c), ativa: false }); break; }
    case "add-cap": {
      const inp = document.getElementById("novaCap-" + id); const nome = inp && inp.value.trim(); if (!nome) break;
      const ordem = Math.max(0, ...capsDo(id).map(c => c.ordem || 0)) + 1;
      inp.value = ""; inp.blur();
      await save("capacidades", novoId("cap"), { segmentoId: id, nome, peso: 1, ordem, ativa: true }); break;
    }
    case "add-seg": {
      const inp = document.getElementById("novoSeg"); const nome = inp && inp.value.trim(); if (!nome) break;
      inp.value = ""; inp.blur();
      await save("segmentos", novoId("seg"), { nome, ordem: S.segmentos.size + 1 }); break;
    }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches && e.target.matches("tr.link")) e.target.click();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "buscaPainel") { ui.busca = t.value; deferredRenderKeepFocus(t); }
  if (t.id === "buscaForn") { ui.buscaF = t.value; deferredRenderKeepFocus(t); }
});
function deferredRenderKeepFocus(t) {
  const id = t.id, pos = t.selectionStart;
  t.blur(); render();
  const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
}
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "filtroStatus") { ui.status = t.value; t.blur(); render(); return; }
  if (t.id === "chkEspec") {
    const l = linhaAtual(); if (!l || !perm.write) return;
    const v = clone(l.v);
    v.especializado = t.checked;
    v.historicoStatus = [...(v.historicoStatus || []), { data: hoje(), especializado: t.checked }];
    t.blur();
    await save("vinculos", l.id, v);
    toast(t.checked ? "Selo Especializado marcado" : "Selo Especializado removido");
    return;
  }
  if (t.classList.contains("filtro-seg")) { ui.seg = t.value; t.blur(); render(); return; }
  if (t.dataset.edit) {
    const coll = t.dataset.edit, cur = S[coll].get(t.dataset.id); if (!cur) return;
    const val = t.dataset.k === "peso" ? Number(t.value) : t.value.trim();
    if (val === "" || cur[t.dataset.k] === val) return;
    await save(coll, t.dataset.id, { ...clone(cur), [t.dataset.k]: val });
    return;
  }
  if (t.dataset.crit) {
    const texto = t.value.trim(), nota = Number(t.dataset.nota);
    if (t.dataset.id) {
      const cur = S.criterios.get(t.dataset.id);
      if (cur && cur.descricao !== texto) await save("criterios", t.dataset.id, { ...clone(cur), descricao: texto });
    } else if (texto) {
      await save("criterios", novoId("crit"), { segmentoId: t.dataset.seg || null, dimensao: t.dataset.crit, nota, descricao: texto });
    }
  }
});
function rota() {
  const h = location.hash.replace("#", "");
  if (["painel", "fornecedores", "metodologia", "exportar"].includes(h)) {
    if (!(h === "fornecedores" && ui.tab === "detalhe")) ui.tab = h;
  }
  render();
}
window.addEventListener("hashchange", () => { if (location.hash === "#fornecedores") ui.tab = "fornecedores"; rota(); });
document.querySelectorAll(".tabs a").forEach(a => a.addEventListener("click", () => { if (a.dataset.tab === "fornecedores") { ui.tab = "fornecedores"; render(); } }));

/* ================= início ================= */
rota();
if (window.claude && typeof window.claude.use === "function") startDb().catch(() => { mode = "offline"; render(); });
else startLocal();
})();
</script>
